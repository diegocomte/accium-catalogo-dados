name: Gerar catálogo automaticamente

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  gerar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Executar script
        run: python gerar_catalogo.py

      - name: Commit do JSON atualizado
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add catalogo.json
          git commit -m "Atualização automática do catálogo" || echo "Sem alterações"
          git push
